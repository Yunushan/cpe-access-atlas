# SPDX-License-Identifier: 0BSD
# Gitleaks configuration for cpe-access-atlas.
#
# This project intentionally stores no real credentials, firmware images, or
# subscriber data (see SECURITY.md and .gitignore). This config extends the
# built-in default ruleset. Tests are scanned too: being a fixture path is
# not evidence that an accidentally committed credential is synthetic.

[extend]
useDefault = true
