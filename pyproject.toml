[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cpe-access-atlas"
dynamic = ["version"]
description = "Owner-authorized, firmware-aware access research for ISP-provided modems and routers"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE"]
authors = [
  { name = "Yunus ÇOĞAL" }
]
keywords = [
  "cpe",
  "modem",
  "router",
  "turkey",
  "firmware",
  "right-to-repair"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking"
]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage>=7.6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
cpe-atlas = "cpe_access_atlas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "cpe_access_atlas.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpe_access_atlas = [
  "data/*.json",
  "data/recipes/*.json",
  "data/schemas/*.json"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["src/cpe_access_atlas"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
]
fail_under = 100
