[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpe-access-atlas"
dynamic = ["version"]
description = "Owner-authorized, firmware-aware access research for ISP-provided modems and routers"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE"]
authors = [
  { name = "Yunus ÇOĞAL" }
]
keywords = [
  "cpe",
  "modem",
  "router",
  "turkey",
  "firmware",
  "right-to-repair"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking"
]
dependencies = [
  "jsonschema>=4.23,<5",
  "pycryptodome>=3.23,<4",
]

[project.urls]
Homepage = "https://github.com/Yunushan/cpe-access-atlas"
Repository = "https://github.com/Yunushan/cpe-access-atlas"
Issues = "https://github.com/Yunushan/cpe-access-atlas/issues"
Changelog = "https://github.com/Yunushan/cpe-access-atlas/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage>=7.6,<8",
  "ruff>=0.8,<1",
  "mypy>=1.14,<3",
  "hypothesis>=6.112,<7",
]

[project.scripts]
cpe-atlas = "cpe_access_atlas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "cpe_access_atlas.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpe_access_atlas = [
  "py.typed",
  "data/*.json",
  "data/recipes/*.json",
  "data/schemas/*.json"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF", "SIM", "C4", "PTH", "A", "ARG"]

[tool.ruff.lint.per-file-ignores]
# S101/S105/S106/S108: assert/hardcoded-secret-look-alike/temp-dir findings on
#   intentional test fixtures, not real secrets or production temp-file usage.
# S104/S314: tests deliberately exercise 0.0.0.0 rejection and parse trusted,
#   test-authored XML fixtures rather than externally supplied XML.
# SIM117: nested `with unittest.mock.patch(...)` + `with self.assertRaises(...)`
#   is the repository's consistent test idiom; combining them would reduce
#   readability without fixing a bug.
# ARG001/ARG002: unused fixture/mock arguments are expected in test doubles.
"tests/*" = ["S101", "S104", "S105", "S106", "S108", "S314", "SIM117", "ARG001", "ARG002"]

[tool.coverage.run]
branch = true
source = ["src/cpe_access_atlas"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
]
fail_under = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["src"]
