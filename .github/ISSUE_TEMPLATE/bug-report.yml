name: Software bug report
description: Report a reproducible CLI, packaging, or documentation defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include configuration exports, credentials, cookies, serial numbers,
        MAC addresses, subscriber data, private firmware, or exploit details. Use
        the private vulnerability-reporting link for security-sensitive reports.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and authorization
      options:
        - label: I removed private device and subscriber data from this report.
          required: true
        - label: This report does not contain an unpatched vulnerability or working exploit.
          required: true
  - type: input
    id: version
    attributes:
      label: CPE Access Atlas version
      description: Output of `cpe-atlas --version`, or the full commit ID.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other or multiple
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted inputs only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste only reviewed, non-sensitive output.
    validations:
      required: true
