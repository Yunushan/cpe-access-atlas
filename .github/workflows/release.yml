name: Release validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Local reusable workflows run from this release's exact source commit.
  # Publication must not race independent push workflows or treat SBOMs as tests.
  source-validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  dependency-validation:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read

  secret-validation:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  codeql-validation:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  runtime-sbom:
    timeout-minutes: 15
    env:
      RUNTIME_DEPENDENCIES: ${{ github.workspace }}/.tmp/runtime-dependencies
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python == '3.15' }}
      - name: Install runtime inventory with the target interpreter
        run: python -m pip install --require-hashes --target "${{ env.RUNTIME_DEPENDENCIES }}" -r requirements-runtime.lock
      # pip-api 0.0.34 (used by pip-audit) imports sre_constants, removed in 3.15.
      # Resolve/install with the target above; audit its metadata using 3.14.
      # Do not resolve the runtime lock again under the audit interpreter.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install locked audit tooling
        run: python -m pip install --require-hashes -r requirements-security.lock
      - name: Generate environment-specific runtime SBOM
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_PYTHON: ${{ matrix.python }}
        run: |
          mkdir -p sbom
          python -m pip_audit --path "$RUNTIME_DEPENDENCIES" --strict \
            --format cyclonedx-json \
            --output "sbom/cpe-access-atlas-${RELEASE_TAG}-${TARGET_OS}-python${TARGET_PYTHON}-sbom.cdx.json"
      - name: Verify SBOM matches the target inventory
        shell: python
        run: |
          import json
          import os
          import re
          from importlib.metadata import distributions
          from pathlib import Path

          def identity(name, version):
              return re.sub(r"[-_.]+", "-", name).lower(), version

          expected = {
              identity(dist.metadata["Name"], dist.version)
              for dist in distributions(path=[os.environ["RUNTIME_DEPENDENCIES"]])
          }
          artifacts = list(Path("sbom").glob("*.cdx.json"))
          if not expected or len(artifacts) != 1:
              raise RuntimeError("Expected a nonempty target inventory and exactly one SBOM")
          components = json.loads(artifacts[0].read_text(encoding="utf-8"))["components"]
          actual = [identity(item["name"], item["version"]) for item in components]
          if len(actual) != len(expected) or set(actual) != expected:
              raise RuntimeError("SBOM does not exactly match target runtime dependencies")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-sbom-${{ matrix.os }}-python${{ matrix.python }}
          path: sbom/*.json
          if-no-files-found: error

  validate-release:
    needs: [source-validation, dependency-validation, secret-validation, codeql-validation, runtime-sbom]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release-classification.outputs.prerelease }}
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated release tag
        run: |
          tag_type="$(git cat-file -t "$GITHUB_REF_NAME")"
          if [ "$tag_type" != "tag" ]; then
            echo "Release tag $GITHUB_REF_NAME must be an annotated tag."
            exit 1
          fi
      - name: Verify tag is current main head
        run: |
          main_sha="$(git rev-parse --verify refs/remotes/origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Release tag $GITHUB_REF_NAME must point to the current main head."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify no open CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          page_counts="$(gh api --paginate --method GET \
            -f state=open -f "ref=$GITHUB_REF" -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
            --jq 'length')"
          open_alerts=0
          while IFS= read -r page_count; do
            [ -n "$page_count" ] || continue
            open_alerts=$((open_alerts + page_count))
          done <<< "$page_counts"
          if [ "$open_alerts" -ne 0 ]; then
            echo "Release blocked: $open_alerts open CodeQL alert(s) remain."
            exit 1
          fi
      - name: Verify accepted CodeQL risks on the exact release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_github_production_settings.py \
            --repo "$GITHUB_REPOSITORY" \
            --codeql-risk-ref "$GITHUB_REF" \
            --codeql-risk-commit "$GITHUB_SHA"
      - name: Install release tooling
        run: |
          python -m pip install --require-hashes -r requirements-release.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="$(python -c 'from cpe_access_atlas import __version__; print(f"v{__version__}")')"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag."
            exit 1
          fi
      - name: Verify changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_candidate.py --tag "$RELEASE_TAG"
      - name: Classify release publication
        id: release-classification
        run: |
          prerelease="$(python -c 'import tomllib; from pathlib import Path; from packaging.version import Version; from cpe_access_atlas import __version__; c=tomllib.loads(Path("pyproject.toml").read_text())["project"]["classifiers"]; print(str(Version(__version__).is_prerelease or not any(x in c for x in ("Development Status :: 5 - Production/Stable", "Development Status :: 6 - Mature"))).lower())')"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Validate source
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m mypy src scripts
          python scripts/generate_cli_reference.py --check
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report -m
          cpe-atlas validate
      - name: Build distributions
        # The release lock includes the build backend and its verified hashes.
        # Do not resolve a second, unhashed backend in an isolated environment.
        env:
          PIP_NO_INDEX: "1"
        run: python scripts/build_reproducible.py --dist-dir dist
      - name: Download cross-platform distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python315-distributions-*
          path: cross-platform-dist
      - name: Verify release artifact SHA-256 equality across platforms
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          workspace = Path.cwd()
          root = workspace / "cross-platform-dist"
          expected = {
              "python315-distributions-ubuntu-latest",
              "python315-distributions-windows-latest",
              "python315-distributions-macos-latest",
          }
          downloaded = {path.name: path for path in root.iterdir() if path.is_dir()}
          if set(downloaded) != expected:
              raise RuntimeError(
                  f"Expected cross-platform builds {sorted(expected)}, got {sorted(downloaded)}"
              )

          builds = {"release": workspace / "dist", **downloaded}
          inventories = {}
          for build_name, directory in sorted(builds.items()):
              artifacts = sorted(directory.iterdir())
              wheels = [path for path in artifacts if path.name.endswith(".whl")]
              sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
              if (
                  len(artifacts) != 2
                  or len(wheels) != 1
                  or len(sdists) != 1
                  or any(not path.is_file() for path in artifacts)
              ):
                  raise RuntimeError(
                      f"{build_name} must contain exactly one wheel and one source archive"
                  )
              inventory = {}
              for path in artifacts:
                  with path.open("rb") as stream:
                      inventory[path.name] = hashlib.file_digest(stream, "sha256").hexdigest()
              inventories[build_name] = inventory

          baseline = inventories["release"]
          mismatches = {
              name: inventory
              for name, inventory in inventories.items()
              if inventory != baseline
          }
          if mismatches:
              raise RuntimeError(
                  "Release distribution SHA-256 inventory differs from cross-platform builds: "
                  f"{mismatches!r}"
              )
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test bundled source distribution
        run: python scripts/check_sdist.py --dist-dir dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install --require-hashes -r requirements-runtime.lock
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/release-wheel/bin/cpe-atlas" validate
      - name: Install source distribution in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/release-sdist"
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install --require-hashes -r requirements-runtime.lock
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install --require-hashes -r requirements-build.lock
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install --no-deps --no-build-isolation dist/*.tar.gz
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip check
          "$RUNNER_TEMP/release-sdist/bin/cpe-atlas" validate
      - name: Collect runtime SBOMs for every supported environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-sbom-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        run: sha256sum dist/*.whl dist/*.tar.gz dist/*.json > "dist/SHA256SUMS"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpe-access-atlas-${{ github.ref_name }}
          path: dist/*

  publish-release:
    needs: validate-release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    environment:
      name: release
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cpe-access-atlas-${{ github.ref_name }}
          path: dist
      - name: Verify exact release bundle and checksums
        run: |
          set -euo pipefail
          if [ ! -f dist/SHA256SUMS ]; then
            echo "Validated release bundle has no checksum manifest."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          expected=(
            "dist/cpe_access_atlas-${version}-py3-none-any.whl"
            "dist/cpe_access_atlas-${version}.tar.gz"
          )
          for system in ubuntu-latest windows-latest macos-latest; do
            for python in 3.11 3.12 3.13 3.14 3.15; do
              expected+=(
                "dist/cpe-access-atlas-${GITHUB_REF_NAME}-${system}-python${python}-sbom.cdx.json"
              )
            done
          done
          mapfile -t expected_paths < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          mapfile -t actual_paths < <(
            find dist -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort
          )
          mapfile -t listed_paths < <(awk '{print $2}' dist/SHA256SUMS | LC_ALL=C sort)
          entry_count="$(find dist -mindepth 1 -maxdepth 1 -print | wc -l)"
          if [ "$entry_count" -ne 18 ] \
            || [ "${#expected_paths[@]}" -ne 17 ] \
            || [ "${#actual_paths[@]}" -ne 17 ] \
            || [ "${#listed_paths[@]}" -ne 17 ]; then
            echo "Validated release bundle has an unexpected entry count."
            exit 1
          fi
          if ! diff -u \
            <(printf '%s\n' "${expected_paths[@]}") \
            <(printf '%s\n' "${actual_paths[@]}"); then
            echo "Validated release bundle has missing or unexpected assets."
            exit 1
          fi
          if ! diff -u \
            <(printf '%s\n' "${expected_paths[@]}") \
            <(printf '%s\n' "${listed_paths[@]}"); then
            echo "Checksum manifest does not list the exact release assets."
            exit 1
          fi
          sha256sum --check --strict dist/SHA256SUMS
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; published artifacts will not be overwritten."
            exit 1
          fi
      - name: Reverify annotated tag and main targets before attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          tag_name = os.environ["GITHUB_REF_NAME"]

          def get(path):
              result = subprocess.run(
                  ["gh", "api", "--method", "GET", path],
                  capture_output=True, text=True, check=True, timeout=30,
              )
              value = json.loads(result.stdout)
              if not isinstance(value, dict):
                  raise RuntimeError("GitHub returned malformed tag metadata")
              return value

          ref = get(f"repos/{repository}/git/ref/tags/{tag_name}")
          tag_object = ref.get("object")
          if (
              not isinstance(tag_object, dict)
              or tag_object.get("type") != "tag"
              or not isinstance(tag_object.get("sha"), str)
              or re.fullmatch(r"[0-9a-f]{40}", tag_object["sha"]) is None
          ):
              raise RuntimeError("Release ref is no longer the validated annotated tag")
          annotated = get(f"repos/{repository}/git/tags/{tag_object['sha']}")
          target = annotated.get("object")
          if (
              not isinstance(target, dict)
              or target.get("type") != "commit"
              or target.get("sha") != os.environ["GITHUB_SHA"]
          ):
              raise RuntimeError("Release tag no longer targets the validated commit")
          main_ref = get(f"repos/{repository}/git/ref/heads/main")
          main_target = main_ref.get("object")
          if (
              not isinstance(main_target, dict)
              or main_target.get("type") != "commit"
              or main_target.get("sha") != os.environ["GITHUB_SHA"]
          ):
              raise RuntimeError("Validated release commit is no longer the current main head")
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Reverify annotated tag and main targets after attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          tag_name = os.environ["GITHUB_REF_NAME"]

          def get(path):
              result = subprocess.run(
                  ["gh", "api", "--method", "GET", path],
                  capture_output=True, text=True, check=True, timeout=30,
              )
              value = json.loads(result.stdout)
              if not isinstance(value, dict):
                  raise RuntimeError("GitHub returned malformed tag metadata")
              return value

          ref = get(f"repos/{repository}/git/ref/tags/{tag_name}")
          tag_object = ref.get("object")
          if (
              not isinstance(tag_object, dict)
              or tag_object.get("type") != "tag"
              or not isinstance(tag_object.get("sha"), str)
              or re.fullmatch(r"[0-9a-f]{40}", tag_object["sha"]) is None
          ):
              raise RuntimeError("Release ref is no longer the validated annotated tag")
          annotated = get(f"repos/{repository}/git/tags/{tag_object['sha']}")
          target = annotated.get("object")
          if (
              not isinstance(target, dict)
              or target.get("type") != "commit"
              or target.get("sha") != os.environ["GITHUB_SHA"]
          ):
              raise RuntimeError("Release tag no longer targets the validated commit")
          main_ref = get(f"repos/{repository}/git/ref/heads/main")
          main_target = main_ref.get("object")
          if (
              not isinstance(main_target, dict)
              or main_target.get("type") != "commit"
              or main_target.get("sha") != os.environ["GITHUB_SHA"]
          ):
              raise RuntimeError("Validated release commit is no longer the current main head")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" != "true" ] && [ "$PRERELEASE" != "false" ]; then
            echo "Release classification output is invalid."
            exit 1
          fi
          release_args=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi
          # gh creates a draft, uploads all assets, then publishes it. Repository
          # release immutability must be enabled before this protected tag runs.
          gh release create "$GITHUB_REF_NAME" dist/* "${release_args[@]}"
      - name: Verify published release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import subprocess

          result = subprocess.run(
              ["gh", "api", "--method", "GET",
               f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['GITHUB_REF_NAME']}"],
              capture_output=True, text=True, check=True, timeout=30,
          )
          release = json.loads(result.stdout)
          if not isinstance(release, dict) or release.get("immutable") is not True:
              raise RuntimeError(
                  "Published release immutability was not verified; do not replace its assets"
              )
      - name: Verify published asset bytes and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          workspace="$RUNNER_TEMP/published-release"
          mkdir -p "$workspace/dist"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$workspace/dist"

          expected=(
            "dist/cpe_access_atlas-${version}-py3-none-any.whl"
            "dist/cpe_access_atlas-${version}.tar.gz"
          )
          for system in ubuntu-latest windows-latest macos-latest; do
            for python in 3.11 3.12 3.13 3.14 3.15; do
              expected+=(
                "dist/cpe-access-atlas-${GITHUB_REF_NAME}-${system}-python${python}-sbom.cdx.json"
              )
            done
          done

          mapfile -t expected_paths < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          mapfile -t actual_paths < <(
            find "$workspace/dist" -maxdepth 1 -type f ! -name SHA256SUMS \
              -printf 'dist/%f\n' | LC_ALL=C sort
          )
          mapfile -t listed_paths < <(
            awk '{print $2}' "$workspace/dist/SHA256SUMS" | LC_ALL=C sort
          )
          entry_count="$(find "$workspace/dist" -mindepth 1 -maxdepth 1 -print | wc -l)"
          if [ "$entry_count" -ne 18 ] \
            || [ "${#expected_paths[@]}" -ne 17 ] \
            || [ "${#actual_paths[@]}" -ne 17 ] \
            || [ "${#listed_paths[@]}" -ne 17 ]; then
            echo "Published release has an unexpected entry count."
            exit 1
          fi
          if ! diff -u \
            <(printf '%s\n' "${expected_paths[@]}") \
            <(printf '%s\n' "${actual_paths[@]}"); then
            echo "Published release has missing or unexpected assets."
            exit 1
          fi
          if ! diff -u \
            <(printf '%s\n' "${expected_paths[@]}") \
            <(printf '%s\n' "${listed_paths[@]}"); then
            echo "Published checksum manifest does not list the exact release assets."
            exit 1
          fi

          (cd "$workspace" && sha256sum --check --strict dist/SHA256SUMS)
          attested_paths=("${expected_paths[@]}" "dist/SHA256SUMS")
          for relative in "${attested_paths[@]}"; do
            gh attestation verify "$workspace/$relative" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "Yunushan/cpe-access-atlas/.github/workflows/release.yml" \
              --source-ref "refs/tags/$GITHUB_REF_NAME" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
