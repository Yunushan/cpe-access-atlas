name: Release validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install release tooling
        run: |
          python -m pip install -r requirements-release.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="$(python -c 'from cpe_access_atlas import __version__; print(f"v{__version__}")')"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag."
            exit 1
          fi
      - name: Verify changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! grep -Fq "## $version" CHANGELOG.md; then
            echo "CHANGELOG.md has no heading for release $version."
            exit 1
          fi
      - name: Verify annotated release tag
        run: |
          tag_type="$(git cat-file -t "$GITHUB_REF_NAME")"
          if [ "$tag_type" != "tag" ]; then
            echo "Release tag $GITHUB_REF_NAME must be an annotated tag."
            exit 1
          fi
      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi
      - name: Validate source
        run: |
          python -m ruff check src tests
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report -m
          cpe-atlas validate
      - name: Build distributions
        run: python -m build --wheel --sdist
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install -r requirements-runtime.lock
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/release-wheel/bin/cpe-atlas" validate
      - name: Install source distribution in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/release-sdist"
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install -r requirements-runtime.lock
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install -r requirements-build.lock
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install --no-deps --no-build-isolation dist/*.tar.gz
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip check
          "$RUNNER_TEMP/release-sdist/bin/cpe-atlas" validate
      - name: Generate runtime dependency SBOM
        run: |
          python -m venv "$RUNNER_TEMP/release-sbom"
          "$RUNNER_TEMP/release-sbom/bin/python" -m pip install -r requirements-security.lock
          "$RUNNER_TEMP/release-sbom/bin/python" -m pip_audit -r requirements-runtime.lock \
            --format cyclonedx-json \
            --strict \
            --output "dist/cpe-access-atlas-${GITHUB_REF_NAME}-sbom.cdx.json"
      - name: Create checksums
        run: sha256sum dist/*.whl dist/*.tar.gz dist/*.json > "dist/SHA256SUMS"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpe-access-atlas-${{ github.ref_name }}
          path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
