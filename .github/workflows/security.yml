name: Security audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d6f9c4 # v5.6.0
        with:
          python-version: "3.13"
      - name: Create isolated audit environment
        run: |
          python -m venv "$RUNNER_TEMP/security-venv"
          "$RUNNER_TEMP/security-venv/bin/python" -m pip install -e .
          "$RUNNER_TEMP/security-venv/bin/python" -m pip install "pip-audit>=2.7,<3"
      - name: Check installed dependency consistency
        run: |
          "$RUNNER_TEMP/security-venv/bin/python" -m pip check
      - name: Audit dependencies
        run: |
          "$RUNNER_TEMP/security-venv/bin/pip-audit" --local
