name: Security audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Verify Node.js
        run: node --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Create isolated audit environment
        run: |
          python -m venv "$RUNNER_TEMP/security-venv"
          "$RUNNER_TEMP/security-venv/bin/python" -m pip install -e .
          "$RUNNER_TEMP/security-venv/bin/python" -m pip install "pip-audit>=2.7,<3"
      - name: Check installed dependency consistency
        run: |
          "$RUNNER_TEMP/security-venv/bin/python" -m pip check
      - name: Audit dependencies
        run: |
          "$RUNNER_TEMP/security-venv/bin/pip-audit" --local
