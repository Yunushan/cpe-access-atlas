name: DCO

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-signoff:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every commit has a DCO Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <[^<>]+@[^<>]+>$'; then
              echo "::error::Commit $commit is missing a DCO 'Signed-off-by' trailer."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits in this pull request lack a Developer Certificate" \
                 "of Origin sign-off. See CONTRIBUTING.md for the required trailer format" \
                 "and use 'git commit --signoff' (or -s) to add it."
            exit 1
          fi
