name: DCO

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-signoff:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify every commit has a DCO Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # This historical squash commit credited Dependabot while retaining
          # the human PR commit's trailer. Mainline checks start after it.
          DCO_BASELINE: eb11b6910c1126fd7639a152f233a8fb3880a4d8
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            if ! git merge-base --is-ancestor "$DCO_BASELINE" "$GITHUB_SHA"; then
              echo "::error::Protected main no longer contains the DCO audit baseline."
              exit 1
            fi
            range="$DCO_BASELINE..$GITHUB_SHA"
          fi
          commits="$(git rev-list "$range")"
          if [ -z "$commits" ]; then
            echo "::error::DCO audit found no commits to inspect."
            exit 1
          fi
          missing=0
          while IFS= read -r commit; do
            author_email="$(git show -s --format=%ae "$commit")"
            # A single-line squash merge can collapse the retained trailer onto
            # the end of the body prose, hiding it from interpret-trailers. The
            # reviewed normalizer recovers only that narrow collapsed-squash shape;
            # every other message is passed through unchanged. The recovered
            # sign-off must still match the author email in the matcher below, so
            # an unsigned commit cannot pass merely because recovery ran.
            trailers="$(git show -s --format=%B "$commit" \
              | python -B scripts/dco_normalize.py \
              | git interpret-trailers --parse)"
            if ! printf '%s\n' "$trailers" \
              | AUTHOR_EMAIL="$author_email" awk -f .github/dco-signoff.awk; then
              echo "::error::Commit $commit lacks a valid DCO sign-off matching its author email."
              missing=1
            fi
          done <<< "$commits"
          if [ "$missing" -ne 0 ]; then
            echo "One or more audited commits lack a Developer Certificate" \
                 "of Origin sign-off. See CONTRIBUTING.md for the required trailer format" \
                 "and use 'git commit --signoff' (or -s) to add it."
            exit 1
          fi
