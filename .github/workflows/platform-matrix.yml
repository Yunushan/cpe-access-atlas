name: Experimental platform matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    name: Experimental Linux arm64 / Python ${{ matrix.python }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python == '3.15' }}
          check-latest: ${{ matrix.python == '3.15' }}
      - name: Record actual runner platform
        shell: python
        run: |
          import platform
          import sys
          print(f"system={platform.system()} release={platform.release()}")
          print(f"machine={platform.machine()} libc={platform.libc_ver()}")
          print(f"python={sys.version}")
      - name: Install locked dependencies and package
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Format check
        run: python -m ruff format --check src tests scripts
      - name: Type check
        run: python -m mypy src scripts
      - name: Compile
        run: python -m compileall -q src
      - name: Test and enforce 100 percent coverage
        run: |
          python -B -m coverage erase
          python -B -m coverage run -m unittest discover -s tests
          python -m coverage report -m
      - name: Validate catalog
        run: cpe-atlas validate
      - name: Smoke test exact target
        run: >-
          cpe-atlas status
          --isp "turk-telekom"
          --model "ZTE H3600P"
          --hardware-revision "V9.0"
          --firmware "H3600P V9.0 TTN.10_260210"
