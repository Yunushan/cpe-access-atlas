name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks/gitleaks
      GIT_NO_REPLACE_OBJECTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gitleaks"
          archive="$directory/gitleaks_8.30.1_linux_x64.tar.gz"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" --directory "$directory" gitleaks
          chmod 0755 "$GITLEAKS_BINARY"
          test "$("$GITLEAKS_BINARY" version)" = "8.30.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Exercise the real scanner against regression fixtures
        run: python -m unittest discover -s tests -p test_secret_scan.py -v
      - name: Scan complete history and current tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git rev-parse --show-prefix)"
          git rev-parse --verify 'HEAD^{commit}' > /dev/null
          # The scanner can report success after an underlying Git read error.
          # Independently reject incomplete ancestry, missing blobs, and corruption.
          git rev-list --objects --missing=error HEAD > /dev/null
          git fsck --full --strict --no-reflogs --no-dangling > /dev/null
          # Gitleaks loads source/.gitleaksignore even with an explicit override.
          # Reject repository suppressions, then supply an empty external file.
          if [ -e .gitleaksignore ] || [ -L .gitleaksignore ]; then
            echo "Repository .gitleaksignore is not allowed by the required scan."
            exit 1
          fi
          ignore_file="$(mktemp)"
          trap 'rm -f "$ignore_file"' EXIT
          # Scan the complete ancestry of the checked-out candidate, including
          # merge-only and binary-attributed additions. No API page, first-parent,
          # or commit-count limit; --text prevents Git from hiding those patches.
          "$GITLEAKS_BINARY" git --config .gitleaks.toml --redact=100 --no-banner --exit-code=2 \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$ignore_file" \
            --log-opts="HEAD --full-history --diff-merges=separate --text" .
          # A separate tree scan also covers unchanged and uncommitted files.
          "$GITLEAKS_BINARY" dir --config .gitleaks.toml --redact=100 --no-banner --exit-code=2 \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$ignore_file" .
