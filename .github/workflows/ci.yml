name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          # Use the current RC until 3.15 final is available, then prefer final.
          allow-prereleases: ${{ matrix.python == '3.15' }}
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Format check
        run: python -m ruff format --check src tests scripts
      - name: Type check
        run: python -m mypy src scripts
      - name: Compile
        run: python -m compileall -q src
      - name: CLI reference is up to date
        # argparse's help formatting differs across Python versions, so this
        # generated doc is only guaranteed to match on the same interpreter
        # used to generate it; check it once rather than on every matrix cell.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python scripts/generate_cli_reference.py --check
      - name: Test
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage
        run: python -m coverage report -m
      - name: Validate catalog
        run: cpe-atlas validate
      - name: Smoke test exact target
        run: >-
          cpe-atlas status
          --isp "Türk Telekom"
          --model "ZTE H3600P"
          --hardware-revision "V9.0"
          --firmware "H3600P V9.0 TTN.10_260210"
      - name: Build Python 3.15 distributions
        if: matrix.python == '3.15'
        env:
          PIP_NO_INDEX: "1"
        run: python -m build --wheel --sdist --no-isolation
      - name: Test Python 3.15 bundled source distribution
        if: matrix.python == '3.15'
        run: python scripts/check_sdist.py --dist-dir dist
      - name: Install Python 3.15 artifacts in clean environments
        if: matrix.python == '3.15'
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          root = Path.cwd()
          for pattern in ("*.whl", "*.tar.gz"):
              artifacts = list((root / "dist").glob(pattern))
              if len(artifacts) != 1:
                  raise RuntimeError(f"Expected exactly one {pattern} artifact")
              with TemporaryDirectory() as directory:
                  env = Path(directory) / "venv"
                  subprocess.run([sys.executable, "-m", "venv", str(env)], check=True, timeout=120)
                  python = env / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
                  locks = ["runtime", "build"] if pattern == "*.tar.gz" else ["runtime"]
                  for lock in locks:
                      subprocess.run(
                          [str(python), "-m", "pip", "install", "--require-hashes",
                           "-r", str(root / f"requirements-{lock}.lock")],
                          check=True, timeout=180,
                      )
                  subprocess.run(
                      [str(python), "-m", "pip", "install", "--no-deps", "--no-build-isolation",
                       "--no-index", "--no-cache-dir", str(artifacts[0])],
                      check=True, timeout=180,
                  )
                  subprocess.run([str(python), "-m", "pip", "check"], check=True, timeout=60)
                  # Isolated mode and an unrelated cwd prevent source-tree imports.
                  subprocess.run(
                      [str(python), "-I", "-m", "cpe_access_atlas", "validate"],
                      cwd=directory, check=True, timeout=60,
                  )

  package-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Build distributions
        # Reuse the hash-verified backend from requirements-ci.lock. A new
        # isolated build environment would install it again without those hashes.
        env:
          PIP_NO_INDEX: "1"
        run: python -m build --wheel --sdist --no-isolation
      - name: Test bundled source distribution
        run: python scripts/check_sdist.py --dist-dir dist
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke-wheel"
          "$RUNNER_TEMP/package-smoke-wheel/bin/python" -m pip install --require-hashes -r requirements-runtime.lock
          "$RUNNER_TEMP/package-smoke-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/package-smoke-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/package-smoke-wheel/bin/cpe-atlas" validate
      - name: Install sdist in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke-sdist"
          "$RUNNER_TEMP/package-smoke-sdist/bin/python" -m pip install --require-hashes -r requirements-runtime.lock
          "$RUNNER_TEMP/package-smoke-sdist/bin/python" -m pip install --require-hashes -r requirements-build.lock
          "$RUNNER_TEMP/package-smoke-sdist/bin/python" -m pip install --no-deps --no-build-isolation dist/*.tar.gz
          "$RUNNER_TEMP/package-smoke-sdist/bin/python" -m pip check
          "$RUNNER_TEMP/package-smoke-sdist/bin/cpe-atlas" validate
