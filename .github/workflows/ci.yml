name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Verify Node.js
        run: node --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage
        run: python -m coverage report -m
      - name: Validate catalog
        run: cpe-atlas validate
      - name: Smoke test exact target
        run: >-
          cpe-atlas status
          --isp "Türk Telekom"
          --model "ZTE H3600P"
          --hardware-revision "V9.0"
          --firmware "H3600P V9.0 TTN.10_260210"

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Verify Node.js
        run: node --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build --wheel --sdist --no-isolation
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-smoke/bin/cpe-atlas" validate
