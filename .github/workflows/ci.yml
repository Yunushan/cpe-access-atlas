name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage
        run: python -m coverage report -m
      - name: Validate catalog
        run: cpe-atlas validate
      - name: Smoke test exact target
        run: >-
          cpe-atlas status
          --isp "Türk Telekom"
          --model "ZTE H3600P"
          --hardware-revision "V9.0"
          --firmware "H3600P V9.0 TTN.10_260210"

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build --wheel --sdist --no-isolation
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-smoke/bin/cpe-atlas" validate
