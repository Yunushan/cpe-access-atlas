# SPDX-License-Identifier: 0BSD
#
# Local development hook set. Install with:
#   python -m pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# These hooks mirror the checks enforced in .github/workflows/ci.yml so
# issues are caught before a commit is pushed, not just in CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 7c55798a78262d14b2074abf623d8a992ebb70d4 # v0.16.2
    hooks:
      - id: ruff
        name: ruff lint
        args: ["--fix"]
      - id: ruff-format
        name: ruff format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee # v2.3.1
    hooks:
      - id: mypy
        name: mypy (strict)
        additional_dependencies:
          - "types-jsonschema==4.26.0.20260518"
          - "pycryptodome==3.23.0"
        args: ["src", "scripts"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: cpe-atlas-validate
        name: cpe-atlas validate
        entry: cpe-atlas
        args: ["validate"]
        language: system
        pass_filenames: false
        always_run: true
